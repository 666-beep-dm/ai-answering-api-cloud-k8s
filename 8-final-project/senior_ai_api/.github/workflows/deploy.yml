name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install flake8 black isort
      - run: black --check .
      - run: isort --check-only .
      - run: flake8 . --max-line-length=100 --exclude=alembic

  test:
    name: Async Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v --asyncio-mode=auto

  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy-simulation:
    name: Deploy Simulation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Deploying ghcr.io/${{ github.repository }}:latest to cluster..."
      - run: echo "kubectl set image deployment/ai-api api=ghcr.io/${{ github.repository }}:latest"
      - run: echo "Deploy simulation complete."
