apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-api-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: ai-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: ai-api-svc, port: { number: 80 } }
