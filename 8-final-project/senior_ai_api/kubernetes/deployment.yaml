apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: ai-api }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: your-registry/ai-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ai-api-config }
            - secretRef:    { name: ai-api-secret }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "2Gi"  }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
