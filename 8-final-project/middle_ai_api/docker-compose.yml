version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - vector_db_data:/app/vector_db   # persists FAISS index between restarts
      - logs_data:/app/logs             # persists log files
    restart: unless-stopped

volumes:
  vector_db_data:
  logs_data:
