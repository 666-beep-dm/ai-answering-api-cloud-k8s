version: "3.9"

# ── Shared network ────────────────────────────────────────────────
networks:
  backend:
    driver: bridge

# ── Persistent volumes ────────────────────────────────────────────
volumes:
  postgres_data:

services:

  # ── PostgreSQL 15 ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pg_db
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # DO NOT expose port 5432 to host in production!
    # Uncomment only for local debugging:
    # ports:
    #   - "5432:5432"

  # ── FastAPI application ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy   # wait for DB healthcheck to pass
    volumes:
      - ./scripts/wait-for-db.sh:/wait-for-db.sh:ro
