# k8s/patched/secret.yaml
# Секреты управляются через External Secrets Operator (ESO) или Vault Agent.
# Этот файл — шаблон структуры; реальные значения никогда не попадают в git.
# В CI/CD: kubectl create secret generic rag-secrets --from-env-file=.env.prod

apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-prod
type: Opaque
# data заполняется через sealed-secrets / ESO / Vault — НЕ хранить здесь!
# stringData:
#   OPENAI_API_KEY: <base64-encoded>
#   POSTGRES_PASSWORD: <base64-encoded>
#   REDIS_PASSWORD: <base64-encoded>
