# k8s/patched/network-policy.yaml
# SEC: NetworkPolicy — минимальные привилегии для сетевого трафика
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-api-netpol
  namespace: rag-prod
spec:
  podSelector:
    matchLabels:
      app: rag-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingress-nginx
      ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    # Исходящий HTTPS для OpenAI API
    - ports:
        - port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: rag-prod
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rag-api
        - podSelector:
            matchLabels:
              app: celery-worker
      ports:
        - port: 6379
