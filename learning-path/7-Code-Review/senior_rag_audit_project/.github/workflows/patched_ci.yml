# .github/workflows/patched_ci.yml — Production-Ready CI/CD
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/rag-api

jobs:
  # ── Stage 1: Quality Gate ─────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r patched_service/requirements.txt ruff mypy pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check patched_service/

      - name: Type check (mypy)
        run: mypy patched_service/app/ --ignore-missing-imports

      - name: Unit tests
        run: pytest tests/ -v --tb=short

  # ── Stage 2: Security Scan ────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST scan (bandit)
        run: |
          pip install bandit
          bandit -r patched_service/app/ -ll

      - name: Container vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: patched_service/

  # ── Stage 3: Build & Push ─────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-stage, layer cache)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: patched_service/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── Stage 4: Deploy to Staging ────────────────────────────────────────────
  deploy-staging:
    name: Deploy -> Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K8s staging
        uses: azure/k8s-deploy@v4
        with:
          namespace: rag-staging
          manifests: k8s/patched/
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test
        run: |
          sleep 15
          curl -f https://staging.example.com/health/live || exit 1

  # ── Stage 5: Deploy to Production (with approval) ─────────────────────────
  deploy-production:
    name: Deploy -> Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production        # требует ручного approval в GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K8s production
        uses: azure/k8s-deploy@v4
        with:
          namespace: rag-prod
          manifests: k8s/patched/
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          strategy: canary
          percentage: 20

      - name: Post-deploy verification
        run: |
          sleep 30
          curl -f https://api.example.com/health/ready || exit 1
