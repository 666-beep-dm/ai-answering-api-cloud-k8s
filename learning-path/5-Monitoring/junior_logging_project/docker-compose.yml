version: "3.9"

services:
  api:
    build: .
    container_name: fastapi_logging_middleware
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
