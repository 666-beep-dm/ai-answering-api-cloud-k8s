version: "3.9"

services:
  api:
    build: .
    container_name: fastapi_advanced_logging
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Log files persist on the host machine under ./logs/
      - ./logs:/app/logs
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/success"]
      interval: 30s
      timeout: 10s
      retries: 3
