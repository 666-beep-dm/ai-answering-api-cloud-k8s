# Prometheus scrape configuration for FastAPI Observability Service
# Docs: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    service:     'fastapi-observability'

# ── Alerting rules ────────────────────────────────────────────────────────
rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "fastapi-observability"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
