apiVersion: v1
kind: Service
metadata:
  name: fastapi-app-svc
  labels:
    app: fastapi-app
spec:
  type: NodePort
  selector:
    app: fastapi-app          # must match Deployment pod labels
  ports:
    - name: http
      protocol: TCP
      port: 80                # ClusterIP port
      targetPort: 8000        # container port
      nodePort: 30080         # accessible on localhost:30080
