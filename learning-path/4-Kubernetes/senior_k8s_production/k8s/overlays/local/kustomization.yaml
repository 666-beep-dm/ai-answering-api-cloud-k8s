# Kustomize overlay for local development
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-system

resources:
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml
  - ../../base/secret.yaml
  - ../../base/db.yaml
  - ../../base/redis.yaml
  - ../../base/api.yaml
  - ../../base/network.yaml

# Patch replicas for local (save resources on laptop)
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: rag-api
