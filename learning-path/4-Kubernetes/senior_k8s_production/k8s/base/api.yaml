# ── FastAPI Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-system
  labels:
    app: rag-api
    tier: backend
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0          # zero-downtime rolling update
  template:
    metadata:
      labels:
        app: rag-api
        tier: backend
    spec:
      # ── Security ────────────────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        runAsGroup:   1000
        fsGroup:      1000

      # ── Wait for dependencies ────────────────────────────────────────────────
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-svc 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3;
              done; echo "PostgreSQL ready."
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-svc 6379; do
                echo "Waiting for Redis..."; sleep 3;
              done; echo "Redis ready."

      containers:
        - name: rag-api
          image: my-rag-api:latest
          imagePullPolicy: Never     # local cluster — no registry push needed
          ports:
            - containerPort: 8000

          # ── Container security ───────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]

          # ── Config (non-sensitive) ───────────────────────────────────────────
          envFrom:
            - configMapRef:
                name: rag-config

          # ── Secrets (sensitive) ──────────────────────────────────────────────
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: PG_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: REDIS_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: OPENAI_API_KEY

          # ── Resources ───────────────────────────────────────────────────────
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"

          # ── Probes ──────────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 12
            periodSeconds: 5         # allow up to 60s for cold start

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
---
# ── API ClusterIP Service ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: rag-api-svc
  namespace: rag-system
  labels:
    app: rag-api
spec:
  type: ClusterIP
  selector:
    app: rag-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
