apiVersion: v1
kind: Service
metadata:
  name: fastapi-app-svc
  labels:
    app: fastapi-app
spec:
  type: NodePort
  selector:
    app: fastapi-app          # binds to pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 80                # cluster-internal port
      targetPort: 8000        # container port
      nodePort: 30080         # external: localhost:30080 (Docker Desktop) or <minikube-ip>:30080
