# ══════════════════════════════════════════════════════════════════════
# docker-compose.yml  ✅  FIXED / PRODUCTION SCENARIO
# ══════════════════════════════════════════════════════════════════════
version: "3.9"

networks:
  rag_net:
    driver: bridge

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: rag_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rag_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    env_file:
      - .env
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      SIMULATE_BLOCKING_IO_SECONDS: "0.05"   # minimal in optimized mode
      SIMULATE_LLM_DELAY_SECONDS: "0.1"      # minimal in optimized mode
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    networks:
      - rag_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --loop uvloop
        --http h11
    restart: unless-stopped
