# ══════════════════════════════════════════════════════════════════════
# nginx.buggy.conf  ❌  BOTTLENECK #3
# proxy_read_timeout = 5s  →  LLM takes 9s+  →  504 Gateway Timeout
# proxy_buffering = on     →  streaming responses not delivered until
#                             the full response is buffered
# ══════════════════════════════════════════════════════════════════════
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # ❌ BOTTLENECK #3: timeouts too short for slow LLM responses
            proxy_connect_timeout  5s;
            proxy_send_timeout     5s;
            proxy_read_timeout     5s;   # LLM needs 9s → 504 every time

            # ❌ Buffering on: streaming responses won't reach client
            #    until the entire response is buffered by Nginx
            proxy_buffering        on;
            proxy_buffer_size      4k;
            proxy_buffers          4 4k;
        }
    }
}
