# ══════════════════════════════════════════════════════════════════════
# nginx.conf  ✅  FIXED CONFIGURATION
# ══════════════════════════════════════════════════════════════════════
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"body_bytes_sent":$body_bytes_sent}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;

    # ── Gzip (non-streaming responses only) ──────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Health probe (bypass to API) ─────────────────────────────
        location /health {
            proxy_pass http://api_backend;
            proxy_read_timeout 5s;
        }

        # ── Streaming endpoint — buffering MUST be off ────────────────
        location /ask-stream {
            proxy_pass             http://api_backend;
            proxy_http_version     1.1;
            proxy_set_header       Connection         "";
            proxy_set_header       Host               $host;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;

            # ✅ FIX: long timeout for streaming LLM responses
            proxy_connect_timeout  10s;
            proxy_send_timeout     120s;
            proxy_read_timeout     120s;

            # ✅ FIX: disable buffering so tokens reach the client immediately
            proxy_buffering        off;
            proxy_cache            off;

            # Tell upstream we accept SSE
            proxy_set_header       Accept             "text/event-stream";
            chunked_transfer_encoding on;
        }

        # ── Standard endpoints ────────────────────────────────────────
        location / {
            proxy_pass             http://api_backend;
            proxy_http_version     1.1;
            proxy_set_header       Connection         "";
            proxy_set_header       Host               $host;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;

            # ✅ FIX: generous timeouts for async LLM calls
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            proxy_buffering        on;
            proxy_buffer_size      8k;
            proxy_buffers          8 8k;
        }
    }
}
