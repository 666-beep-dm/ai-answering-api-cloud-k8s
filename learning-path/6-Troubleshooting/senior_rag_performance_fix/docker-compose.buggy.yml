# ══════════════════════════════════════════════════════════════════════
# docker-compose.buggy.yml  ❌  BOTTLENECK SCENARIO
# nginx with 5s proxy_read_timeout + API with 1 worker
# ══════════════════════════════════════════════════════════════════════
version: "3.9"

networks:
  rag_net:
    driver: bridge

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: rag_nginx_buggy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.buggy.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rag_net
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api_buggy
    environment:
      APP_ENV: development
      LOG_LEVEL: WARNING
      SIMULATE_BLOCKING_IO_SECONDS: "3.0"
      SIMULATE_LLM_DELAY_SECONDS: "6.0"
      WORKERS: "1"
    # Tight resource limits simulate a constrained cloud instance
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - rag_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
